[project]
name = "clipped-asgd-reproduction"
version = "0.1.0"
description = "Claim-by-claim reproduction of arXiv:2606.13287"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "marimo==0.23.14",
  "matplotlib==3.10.3",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "torch==2.7.1",
  "torchvision==0.22.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 100
target-version = "py312"
